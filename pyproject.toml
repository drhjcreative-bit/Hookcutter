[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hookcut"
version = "0.1.0"
description = "Automated social-media video editor: hook detection, transcription, multi-length cuts, captions, and self-audit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
smart = ["anthropic>=0.39", "scenedetect>=0.6.4"]
sources = ["yt-dlp>=2024.1", "gdown>=5.1", "requests>=2.31"]
music = ["librosa>=0.10"]
all = [
    "anthropic>=0.39", "scenedetect>=0.6.4", "yt-dlp>=2024.1",
    "gdown>=5.1", "requests>=2.31", "librosa>=0.10",
]

[project.scripts]
hookcut = "hookcut.cli:main"

[tool.setuptools]
packages = ["hookcut"]

[tool.setuptools.package-data]
hookcut = ["trends.yaml"]
